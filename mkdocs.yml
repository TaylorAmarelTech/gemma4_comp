site_name: DueCare
site_url: https://tayloramareltech.github.io/gemma4_comp/
site_description: >-
  Open-source Gemma 4 safety ecosystem for migrant workers, NGOs,
  regulators, researchers, platform safety teams, and anonymized
  knowledge sharing. MIT licensed. Runs offline.
site_author: Taylor Amarel
repo_url: https://github.com/TaylorAmarelTech/gemma4_comp
repo_name: TaylorAmarelTech/gemma4_comp
edit_uri: edit/master/docs/
copyright: >-
  MIT licensed.
  <a href="https://github.com/TaylorAmarelTech/gemma4_comp">Source on GitHub.</a>

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    - content.action.view
    - toc.follow
  icon:
    repo: fontawesome/brands/github
    edit: material/pencil
    view: material/eye

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/TaylorAmarelTech
    - icon: fontawesome/brands/kaggle
      link: https://www.kaggle.com/taylorsamarel

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink
  - pymdownx.mark
  - pymdownx.snippets
  - pymdownx.smartsymbols
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

plugins:
  - search:
      separator: '[\s\-,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'
  # mkdocs-material has these built in; add others via requirements-docs.txt
  # - awesome-pages
  # - git-revision-date-localized
  # - minify

# Repository-relative links (for example, from docs/ into packages/ or
# scripts/) and links to provenance pages intentionally excluded from Pages
# work in GitHub but are unavailable to MkDocs. Rewrite only existing targets
# to canonical GitHub source URLs so strict builds can distinguish real broken
# links from intentional source links.
hooks:
  - scripts/mkdocs_repo_links.py

# Keep the public Pages build focused on the current ecosystem,
# onboarding, deployment, and information-sharing paths. Historical
# appendices remain in git for provenance but should not be indexed as
# primary public docs.
exclude_docs: |
  _archive/
  appendices/
  appendix_experiment_ladder.md
  android_app_architecture.md
  claude_*.md
  codex_handoff_*.md
  copilot_handoff_*.md
  component_diagram.md
  duecare_app_launch_guide.md
  ecosystem_overview.md
  architecture.md
  extension_pack_format.md
  integration_plan.md
  kaggle_integration.md
  marias_case_end_to_end.md
  prior_art.md
  project_phases.md
  quality_rubrics.md
  REVIEW_PROMPTS.md
  submission_readiness_audit.md
  stock_vs_harnessed.md
  system_map.md
  system_map.html
  youtube_description.md
  deployment/01_ngo_caseworker_quickstart.md
  deployment/01_ngo_pilot_brief.md
  deployment/02_network_curator_role.md
  deployment/04_platform_cto_pitch.md
  scenarios/chief-architect.md
  scenarios/embassy-consular.md
  scenarios/ilo-iom-regional.md
  scenarios/it-director.md
  scenarios/journalist-investigation.md
  scenarios/lawyer-evidence-prep.md
  scenarios/recruiter-self-audit.md
  scenarios/translations/
  scenarios/vp-engineering.md

# Navigation - simplified GitHub Pages path.
# The public site focuses on users, deployments, and anonymized
# information sharing. Older reports, diagrams, appendices, and internal
# handoffs remain in the repository for provenance but are de-emphasized
# from the public Pages navigation.
nav:
  - Home: index.md
  - User Paths:
      - Choose a path: user_paths.md
      - Platform safety: scenarios/enterprise_pilot.md
      - NGO & regulator: scenarios/caseworker_workflow.md
      - Individual worker / mobile: scenarios/worker-self-help.md
      - Researcher: scenarios/researcher-analysis.md
      - Anonymized knowledge sharing: information_sharing_architecture.md
      - Developer / integration partner: embedding_guide.md
  - Deployment:
      - Deployment overview: deployment_topologies.md
      - Install locally: install.md
      - Local deployment: deployment_local.md
      - Platform / on-prem deployment: deployment_enterprise.md
      - Cloud / hub deployment: cloud_deployment.md
      - Kaggle kernel state: current_kaggle_notebook_state.md
      - Kaggle notebook catalog: NOTEBOOKS.md
      - Notebook guide: notebook_guide.md
  - Training And Fine-Tuning:
      - Overview: training_and_finetuning.md
      - Phase 3 framework: phase3_training_framework.md
      - Data strategy: finetuning_data_strategy.md
      - Methodology: research/training_methodology.md
      - Training for understanding: research/training_for_understanding.md
      - Regimes and systems: research/training_regimes_and_systems.md
  - Information Sharing:
      - Why networked Gemma sharing matters: gemma_networked_knowledge_sharing.md
      - Copy-ready Kaggle post: kaggle_post_networked_knowledge_sharing.md
      - Architecture: information_sharing_architecture.md
      - Autonomous improvement loop: autonomous_improvement_loop.md
      - Anonymization policy: anonymization_policy.md
      - Submission labeling policy: submission_labeling_policy.md
      - Knowledge object taxonomy: adr/007-knowledge-object-taxonomy.md
      - Knowledge module schema: knowledge_module_schema.md
  - Run And Verify:
      - Current project status: project_status.md
      - Maintainer handoff: MAINTAINER_HANDOFF.md
      - Successor pickup rehearsal: SUCCESSOR_REHEARSAL.md
      - 30-day project transition: PROJECT_TRANSITION_PLAN.md
      - Publication readiness and next work: PUBLICATION_READINESS.md
      - Deferred work register: DEFERRED_WORK.md
      - Provider budgeting: PROVIDER_BUDGETING.md
      - Package inventory and release state: PACKAGE_INVENTORY.md
      - For judges and reviewers: FOR_PEER_REVIEW.md
      - Reproducibility: reproducibility.md
      - Harness lift report: harness_lift_report.md
      - OpenAPI spec: openapi.yaml
      - Threat model: considerations/THREAT_MODEL.md
      - Source verification (entity intelligence): entity_intelligence_pipeline.md
      - Contracts catalog (standardized primitives): contracts_catalog.md
      - Platform Triage (screenshots): media/triage/README.md
      - FAQ: FAQ.md
