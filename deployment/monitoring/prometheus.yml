global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert-rules.yml

scrape_configs:
  - job_name: duecare-api
    metrics_path: /metrics
    static_configs:
      - targets:
          - duecare-api:8080

  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090
