# Licensed-entity source catalogue -- official registers of LICENSED ENTITIES by
# COUNTRY x INDUSTRY (recruitment/manning agencies, medical clinics, training centres,
# money lenders, financial-services cos, remittance/MTO, hotels, company registries,
# security services). The mission: every licensed entity, every migration country.
#
# Provenance: 2026-06-13 country-industry-registries research swarm (20 country agents,
# WebFetch-verified, deduped). SOURCES ONLY -- no entity records, nothing fabricated.
# has_data_endpoint: true = exposes a downloadable list / JSON-CSV feed (scrapable);
# url_verified: true = a swarm agent fetched it this run. Addressable in the
# acquisition cascade via --registry <id>. Regenerate by re-running the workflow.
#
# 176 sources | 174 official | 52 with data endpoint | 102 verified | 20 countries

