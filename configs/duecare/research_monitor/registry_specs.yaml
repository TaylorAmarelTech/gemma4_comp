catalog: registry_specs
purpose: >-
  Config-driven deterministic registry resolvers. Each spec names a URL, a
  format, and a field map; scripts/registry_spec.py fetches + parses it into
  canonical entity records via scripts/registry_parsers.py -- no per-source
  Python. This is how the long tail of the ~357 verified data-endpoints in
  licensed_entity_sources.yaml gets onboarded (as config rows, not code).
  The first three specs REPRODUCE the hand-written bd_oep / bd_mra / cn_mara
  resolvers and must hit the same live counts (2,834 / 904 / 167) -- that is the
  engine's validation. SOURCES ONLY, propose-only.

specs:
  # --- reproductions of the hand-written resolvers (engine validation) -------
  - id: bd_oep_cfg
    url: https://www.oep.gov.bd/agencies
    format: html_table
    entity_type: recruitment_agency
    jurisdiction: BD
    fields:
      name: "Agent Name"
      license_no: "License No"
      address: "Address"
      status: "License Status"
      license_validity: "License Validity"
    row_filter: {field: license_no, pattern: '^RL'}
    note_fields: [license_validity]
    source: "BD OEP/BMET licensed recruiting-agency register"

  - id: bd_mra_cfg
    url: https://ndb.mra.gov.bd/mra_web/everify/mfi-list
    format: json
    entity_type: lender
    jurisdiction: BD
    default_status: licensed
    fields:
      name: full_name_of_org
      license_no: license_no
      address: address_of_org
      license_issue_date: license_issue_date
    note_fields: [license_issue_date]
    source: "BD MRA licensed microfinance institutions (e-verify)"

  - id: cn_mara_cfg
    url: https://www.moa.gov.cn/govpublic/YYJ/202504/t20250417_6473317.htm
    format: html_table
    entity_type: company
    jurisdiction: CN
    default_status: licensed
    fields:
      rank: 0
      name: 1
      score: 2
    row_filter: {field: rank, pattern: '^\d+$'}
    note_fields: [score, rank]
    source: "CN MARA distant-water-fishing enterprise compliance assessment"

  # --- new endpoints onboarded as config (no new Python) ---------------------
  - id: au_vic_building
    url: https://vicopendatavba.blob.core.windows.net/vicopendata/BPR.csv
    format: csv
    entity_type: company
    jurisdiction: AU
    fields:
      name: "Account Name"
      license_no: "Accreditation ID"
      status: "Accreditation Status"
      type: "Type"
      license_expiry: "Expires"
    note_fields: [type, license_expiry]
    source: "Victorian Building Practitioner Register (BPC), Building Act 1993 (Vic)"

  - id: sg_bca_contractors
    url: https://data.gov.sg/api/action/datastore_search?resource_id=d_dcda79be4aded5f9e769b8e23ff69b47
    format: json
    list_path: result.records
    entity_type: company
    jurisdiction: SG
    default_status: registered
    fields:
      name: company_name
      license_no: uen_no
      workhead: workhead
      grade: grade
      license_expiry: expiry_date
    note_fields: [workhead, grade, license_expiry]
    paginate: {size_param: limit, offset_param: offset, size: 5000, max_records: 30000}
    source: "Singapore BCA Contractors Registration System (data.gov.sg)"

  - id: co_ica_bpa
    url: https://www.datos.gov.co/resource/wusb-7b8z.json
    format: json
    entity_type: company
    jurisdiction: CO
    fields:
      name: nombre_predio
      status: vigencia
      municipio: municipio
      departamento: departamento
    note_fields: [municipio, departamento]
    paginate: {size_param: "$limit", offset_param: "$offset", size: 5000, max_records: 60000}
    source: "ICA Colombia - certified Good Agricultural Practices properties (BPA), datos.gov.co"
