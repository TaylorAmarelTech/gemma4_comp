catalog: registry_specs
purpose: >-
  Config-driven deterministic registry resolvers. Each spec names a URL, a
  format, and a field map; scripts/registry_spec.py fetches + parses it into
  canonical entity records via scripts/registry_parsers.py -- no per-source
  Python. This is how the long tail of the ~357 verified data-endpoints in
  licensed_entity_sources.yaml gets onboarded (as config rows, not code).
  The first three specs REPRODUCE the hand-written bd_oep / bd_mra / cn_mara
  resolvers and must hit the same live counts (2,834 / 904 / 167) -- that is the
  engine's validation. SOURCES ONLY, propose-only.

specs:
  # --- reproductions of the hand-written resolvers (engine validation) -------
  - id: bd_oep_cfg
    url: https://www.oep.gov.bd/agencies
    format: html_table
    entity_type: recruitment_agency
    jurisdiction: BD
    fields:
      name: "Agent Name"
      license_no: "License No"
      address: "Address"
      status: "License Status"
      license_validity: "License Validity"
    row_filter: {field: license_no, pattern: '^RL'}
    note_fields: [license_validity]
    source: "BD OEP/BMET licensed recruiting-agency register"

  - id: bd_mra_cfg
    url: https://ndb.mra.gov.bd/mra_web/everify/mfi-list
    format: json
    entity_type: lender
    jurisdiction: BD
    default_status: licensed
    fields:
      name: full_name_of_org
      license_no: license_no
      address: address_of_org
      license_issue_date: license_issue_date
    note_fields: [license_issue_date]
    source: "BD MRA licensed microfinance institutions (e-verify)"

  - id: cn_mara_cfg
    url: https://www.moa.gov.cn/govpublic/YYJ/202504/t20250417_6473317.htm
    format: html_table
    entity_type: company
    jurisdiction: CN
    default_status: licensed
    fields:
      rank: 0
      name: 1
      score: 2
    row_filter: {field: rank, pattern: '^\d+$'}
    note_fields: [score, rank]
    source: "CN MARA distant-water-fishing enterprise compliance assessment"

  # --- new endpoints onboarded as config (no new Python) ---------------------
  - id: au_vic_building
    url: https://vicopendatavba.blob.core.windows.net/vicopendata/BPR.csv
    format: csv
    entity_type: company
    jurisdiction: AU
    fields:
      name: "Account Name"
      license_no: "Accreditation ID"
      status: "Accreditation Status"
      type: "Type"
      license_expiry: "Expires"
    note_fields: [type, license_expiry]
    source: "Victorian Building Practitioner Register (BPC), Building Act 1993 (Vic)"

  - id: sg_bca_contractors
    url: https://data.gov.sg/api/action/datastore_search?resource_id=d_dcda79be4aded5f9e769b8e23ff69b47
    format: json
    list_path: result.records
    entity_type: company
    jurisdiction: SG
    default_status: registered
    fields:
      name: company_name
      license_no: uen_no
      workhead: workhead
      grade: grade
      license_expiry: expiry_date
    note_fields: [workhead, grade, license_expiry]
    paginate: {size_param: limit, offset_param: offset, size: 5000, max_records: 30000}
    source: "Singapore BCA Contractors Registration System (data.gov.sg)"

  - id: co_ica_bpa
    url: https://www.datos.gov.co/resource/wusb-7b8z.json
    format: json
    entity_type: company
    jurisdiction: CO
    fields:
      name: nombre_predio
      status: vigencia
      municipio: municipio
      departamento: departamento
    note_fields: [municipio, departamento]
    paginate: {size_param: "$limit", offset_param: "$offset", size: 5000, max_records: 60000}
    source: "ICA Colombia - certified Good Agricultural Practices properties (BPA), datos.gov.co"

  # uses link-discovery: the data CSV URL is date-stamped, so point at the stable
  # landing page and pick the latest matching CSV.
  - id: gb_licensed_sponsors
    discover:
      page: https://www.gov.uk/government/publications/register-of-licensed-sponsors-workers
      link_pattern: 'Worker.*\.csv'
      pick: latest
    format: csv
    entity_type: company
    jurisdiction: GB
    default_status: licensed
    fields:
      name: "Organisation Name"
      address: "Town/City"
      county: "County"
      type: "Type & Rating"
      route: "Route"
    note_fields: [type, route]
    source: "UK Register of Licensed Sponsors: Workers (Home Office)"

  # link-discovery (html): the registered-ships XLSX URL is date-stamped.
  - id: au_amsa_ships
    discover:
      page: https://www.amsa.gov.au/vessels-operators/ship-registration/list-registered-ships
      link_pattern: 'list-of-registered-ships.*\.xlsx'
      pick: latest
    format: xlsx
    entity_type: vessel
    jurisdiction: AU
    fields:
      name: "Ship name"
      license_no: "Official number"
      status: "Status"
      type: "Type"
      home_port: "Home port"
      year: "Year of completion"
    note_fields: [type, home_port, year]
    source: "AMSA Australian Register of Ships (General + International Shipping Registers)"

  # link-discovery (ckan): pick the latest quarterly positive-LMIA CSV by period.
  - id: ca_tfwp_positive_lmia
    discover:
      page: https://open.canada.ca/data/api/3/action/package_show?id=90fed587-1364-4f33-a9ee-208181dc0b97
      format: ckan
      link_pattern: 'positive_en\.csv'
      pick: latest
    format: csv
    entity_type: employer
    jurisdiction: CA
    default_status: positive_lmia
    fields:
      name: "Employer"
      address: "Address"
      province: "Province/Territory"
      stream: "Stream"
      occupation: "Occupation"
    note_fields: [province, stream, occupation]
    source: "Canada TFWP - employers issued a positive LMIA (Open Government)"

  # hospitality (a migrant-labour sector) from a government data portal (data.gov.hk)
  - id: hk_licensed_hotels_guesthouses
    url: https://www.hadla.gov.hk/psi/licensed-hotels-and-guesthouses/licensed_hotels_and_guesthouses.csv
    format: csv
    entity_type: hotel
    jurisdiction: HK
    default_status: licensed
    fields:
      name: "Premises Name"
      license_no: "Licence No."
      address: "Premises Address"
      phone: "Premises Phone No."
    note_fields: [phone]
    source: "HK Office of the Licensing Authority - Licensed Hotels and Guesthouses (data.gov.hk)"

  - id: tw_mol_manpower
    url: https://apiservice.mol.gov.tw/OdService/download/A17000000J-020002-LkO
    format: json
    entity_type: manning_agency
    jurisdiction: TW
    default_status: approved
    fields:
      name: "英文名稱"
      license_no: "機構編號"
      address: "地址"
      nationality: "國籍"
      approval_expiry: "本國認可有效屆滿日"
    note_fields: [nationality, approval_expiry]
    source: "Taiwan MOL approved overseas manpower intermediaries (data.gov.tw 6683)"
