# Public Information Research Monitor -- source registry (Component 5 MVP).
# PUBLIC pages only. The monitor fetches each, hashes the content, and PROPOSES
# curator-review items when a page changes or 404s. It NEVER mutates production
# packs. Seed URLs may drift; a 404 is itself a useful "unreachable" finding for
# review. Add sources by jurisdiction/corridor over time (watchlists are a
