name: Python package release

# Sole publisher for the 18 duecare-llm* workspace distributions. Packages use
# independent SemVer and production tags select exactly one reviewed manifest
# row: package-NAME-vMAJOR.MINOR.PATCH. Manual runs can build all packages (in
# DEFAULT_BUILD_ORDER), build one package, or publish the selection to TestPyPI;
# they cannot publish to production PyPI.

on:
  push:
    tags:
      - "package-duecare-llm*-v*.*.*"
  workflow_dispatch:
    inputs:
      target:
        description: "Build only or publish the candidate to TestPyPI"
        type: choice
        default: build-only
        options:
          - build-only
          - testpypi
      package:
        description: "Build selector: all, distribution name, or package directory"
        type: string
        default: all

permissions:
  contents: read

concurrency:
  group: python-package-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Validate and build all workspace distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install --upgrade pip build twine

      - name: Validate package-release ownership and version policy
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          PACKAGE_SELECTOR: ${{ github.event.inputs.package || 'all' }}
        run: |
          if [[ -n "$RELEASE_TAG" ]]; then
            python scripts/validate_package_release.py --tag "$RELEASE_TAG"
          else
            python scripts/validate_package_release.py --package "$PACKAGE_SELECTOR"
          fi

      - name: Resolve the manifest-backed build selection
        id: selection
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          PACKAGE_SELECTOR: ${{ github.event.inputs.package || 'all' }}
        run: |
          if [[ -n "$RELEASE_TAG" ]]; then
            PKGS=$(python scripts/validate_package_release.py --tag "$RELEASE_TAG" --print-directories)
          else
            PKGS=$(python scripts/validate_package_release.py --package "$PACKAGE_SELECTOR" --print-directories)
          fi
          test -n "$PKGS"
          echo "packages=$PKGS" >> "$GITHUB_OUTPUT"

      - name: Build selected wheels and source distributions in canonical order
        env:
          PKGS: ${{ steps.selection.outputs.packages }}
        run: |
          mkdir -p dist
          for pkg in $PKGS; do
            echo "==> Building $pkg"
            python -m build --wheel --sdist --outdir dist "packages/$pkg"
          done
          python -m twine check dist/*

      - name: Upload release candidate
        uses: actions/upload-artifact@v7
        with:
          name: python-distributions
          path: dist/
          retention-days: 14
          if-no-files-found: error

  publish-testpypi:
    name: Publish to TestPyPI
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'testpypi'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/duecare-llm/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-distributions
          path: dist/
      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/
          verbose: true

  publish-pypi:
    name: Publish coordinated release to PyPI
    if: github.event_name == 'push' && github.ref_type == 'tag' && !contains(github.ref_name, '-rc')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/duecare-llm/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-distributions
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          verbose: true
