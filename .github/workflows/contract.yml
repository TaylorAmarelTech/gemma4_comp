name: harness-contract

on:
  pull_request:
    paths:
      - "packages/duecare-llm-chat/**"
      - "tests/test_route_contract.py"
      - "tests/test_harness_imports.py"
      - "tests/test_compose_layers.py"
      - "tests/test_multi_harness_integration.py"
      - "tests/test_kaggle_install_policy.py"
      - "scripts/validate_public_surface.py"
      - ".github/workflows/contract.yml"
  push:
    branches: [master, main]

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install workspace
        run: |
          python -m pip install --upgrade pip
          pip install -e ./packages/duecare-llm-core
          pip install -e ./packages/duecare-llm-chat[test]
          pip install fastapi httpx "pydantic>=2" pytest python-multipart jinja2 pyyaml

      - name: Route contract (every endpoint pinned)
        run: pytest tests/test_route_contract.py -q

      - name: Harness contract
        run: pytest tests/test_harness_imports.py -q

      - name: Compose-layers unit tests
        run: pytest tests/test_compose_layers.py -q

      - name: Multi-harness integration
        run: pytest tests/test_multi_harness_integration.py -q

      - name: Kaggle install policy
        run: pytest tests/test_kaggle_install_policy.py -q

      - name: Public-surface audit
        run: python scripts/validate_public_surface.py
