name: docker-publish

# Builds + publishes a multi-arch (linux/amd64 + linux/arm64) Docker
# image to GitHub Container Registry (ghcr.io). Same repo as the
# code, no separate registry credentials.
#
# Triggers:
#   - push to master: validates/builds without publishing
#   - tag v*:        publishes :vX.Y.Z (and :latest if not -rc)
#   - workflow_dispatch: build-only unless push=true is explicitly selected

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      push:
        description: "Publish the candidate to GHCR (manual runs build only by default)"
        type: boolean
        default: false

permissions:
  contents: read
  packages: write
  id-token: write     # for cosign signing

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/duecare-llm

jobs:
  build-publish:
    name: Build + publish multi-arch image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU (for arm64 cross-build)
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.push)
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', 'master') }}
          labels: |
            org.opencontainers.image.title=Duecare LLM
            org.opencontainers.image.description=Toggleable safety harness for Gemma 4 — chat playground + classifier API
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=MIT

      - name: Build + push (PRs build only, no push)
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.push) }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Install cosign
        if: github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.push)
        uses: sigstore/cosign-installer@v4.1.2

      - name: Sign the published image digest with GitHub OIDC
        if: github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.push)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${DIGEST}"

      - name: Image summary
        run: |
          {
            echo "## Docker image candidate"
            echo ""
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo ""
            echo "Pull:"
            echo "  docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
            echo ""
            echo "Run:"
            echo "  docker run -p 8080:8080 ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
          } >> "$GITHUB_STEP_SUMMARY"
