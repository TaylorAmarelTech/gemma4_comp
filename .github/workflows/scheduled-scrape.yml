name: scheduled-scrape

# Scheduled, propose-only freshness monitor over the public official-source
# registry (configs/duecare/research_monitor/sources.yaml) -- including the
# recruitment-agency licensing registries. Runs daily forever; each run hashes
# every source, diffs against the prior run's state, and surfaces a curator
# review queue. It NEVER mutates production knowledge packs and stores no PII.
#
# State persistence: the content-hash state is cached between runs (so a run
# only flags what changed since last time) and also uploaded as an artifact.
# If the cache is evicted, the next run simply re-baselines (every source
# reported "new" once) -- harmless.
#
# Advanced fetch: the monitor prefers curl_cffi (real Chrome TLS fingerprint,
# defeats Cloudflare/Akamai WAF 403s) and falls back to stdlib urllib.

on:
  schedule:
    - cron: "17 6 * * *"   # daily 06:17 UTC
  workflow_dispatch:        # run now from the Actions tab ("starting now")

permissions:
  contents: read

concurrency:
  group: scheduled-scrape
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install monitor (+ advanced-fetch extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e packages/duecare-llm-core || true
          pip install -e packages/duecare-llm-research-tools
          # advanced web scraping: TLS-impersonation fetch + charset detection.
          # Best-effort -- the monitor runs on stdlib urllib without them.
          pip install curl_cffi charset_normalizer pyyaml || true

      - name: Restore prior monitor state
        uses: actions/cache@v4
        with:
          path: .monitor-state
          key: monitor-state-${{ github.run_id }}
          restore-keys: |
            monitor-state-

      - name: Run propose-only monitor
        id: run
        run: |
          mkdir -p .monitor-state reports/research_monitor
          python -m duecare.research_tools.monitor check \
            --sources configs/duecare/research_monitor/sources.yaml \
            --state .monitor-state/state.json \
            --out reports/research_monitor/proposals.json \
            | tee reports/research_monitor/run.log

      - name: Write job summary
        if: always()
        run: |
          {
            echo "## Scheduled scrape — propose-only review queue"
            echo ""
            echo '```'
            cat reports/research_monitor/run.log 2>/dev/null || echo "(no run log)"
            echo '```'
            echo ""
            echo "Proposals are review items only — nothing was applied to the knowledge layer."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload review queue (proposals + log)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-monitor-proposals-${{ github.run_id }}
          path: reports/research_monitor/
          retention-days: 30
          if-no-files-found: warn
