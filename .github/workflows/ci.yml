name: ci

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

# Don't waste minutes on duplicate runs of the same SHA
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:

  curator-blocks-validate:
    name: curator-block validator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run validate_curator_blocks.py
        run: python scripts/validate_curator_blocks.py
      - name: Strict mode (warnings escalated)
        run: python scripts/validate_curator_blocks.py --strict || echo "::warning::strict-mode warnings present"

  wheel-content-check:
    name: wheel-content check (12 curator JSONs ship)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tooling
        run: |
          python -m pip install --no-cache-dir --upgrade pip
          python -m pip install --no-cache-dir build hatchling
      - name: Build chat wheel
        run: |
          cd packages/duecare-llm-chat
          python -m build --wheel --no-isolation --outdir dist/
      - name: Verify wheel contains all 12 curator JSONs + static UI
        run: |
          python - <<'PY'
          import zipfile
          from pathlib import Path
          wheel = next(Path("packages/duecare-llm-chat/dist").glob("*.whl"))
          z = zipfile.ZipFile(wheel)
          names = set(z.namelist())
          required = [
              "duecare/chat/harness/_classifier_signals.json",
              "duecare/chat/harness/_usecase_affinity.json",
              "duecare/chat/harness/_authoritative_statutes.json",
              "duecare/chat/harness/_known_statute_sections.json",
              "duecare/chat/harness/_evaluation_questions.json",
              "duecare/chat/harness/_intent_affinity.json",
              "duecare/chat/harness/_intent_signals.json",
              "duecare/chat/harness/_country_hints.json",
              "duecare/chat/harness/_grader_config.json",
              "duecare/chat/harness/_baseline_gauge.json",
              "duecare/chat/harness/_rubric_hints.json",
              "duecare/chat/harness/_rubric_universal.json",
              "duecare/chat/static/index.html",
          ]
          missing = [r for r in required if r not in names]
          if missing:
              raise SystemExit(f"FAIL: wheel is missing {missing}")
          print(f"OK: {wheel.name} contains all {len(required)} required files")
          PY

  gitleaks:
    name: gitleaks (PII / secret scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  prompt-corpus-validate:
    name: prompt corpus validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate corpus + regenerate stats + per-category exports
        run: |
          python scripts/prompt_corpus.py validate
          python scripts/prompt_corpus.py stats
          python scripts/prompt_corpus.py export-by-category

  validate-benchmark:
    name: kaggle community benchmark validator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install duecare-llm-chat + fastapi for the endpoint roundtrip
        run: |
          python -m pip install --no-cache-dir --upgrade pip
          python -m pip install --no-cache-dir fastapi pydantic httpx python-multipart
          python -m pip install --no-cache-dir -e packages/duecare-llm-core
          python -m pip install --no-cache-dir -e packages/duecare-llm-chat
      - name: Run benchmark validator (6 checks; fails if any regress)
        run: python scripts/validate_benchmark.py

  validate-public-surface:
    name: public-surface audit (drift, route 200s, lane order, kaggle lane labels, canonical messaging)
    runs-on: ubuntu-latest
    # Non-blocking initially: surface findings as a job summary so we
    # can iterate on signal/noise. Promote to blocking by removing
    # `continue-on-error: true` once consistently green for two runs
    # after the canonical-messaging validator landed.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install hub deps (FastAPI + Pydantic) and PyYAML
        run: |
          python -m pip install --no-cache-dir --upgrade pip
          python -m pip install --no-cache-dir fastapi pydantic httpx jinja2 pyyaml python-multipart
      - name: Run public-surface audit
        id: surface_audit
        run: |
          set +e
          python scripts/validate_public_surface.py | tee /tmp/audit.txt
          echo "exit=$?" >> "$GITHUB_OUTPUT"
      - name: Run canonical-messaging audit
        id: messaging_audit
        run: |
          set +e
          python scripts/validate_public_messaging.py | tee /tmp/messaging.txt
          echo "exit=$?" >> "$GITHUB_OUTPUT"
      - name: Job summary
        if: always()
        run: |
          DOC_URL="${{ github.server_url }}/${{ github.repository }}/blob/${{ github.sha }}/docs/AUDIT.md"
          {
            echo "## Public-surface audit"
            echo ""
            echo '```'
            cat /tmp/audit.txt 2>/dev/null || echo "(skipped)"
            echo '```'
            echo ""
            echo "## Canonical messaging audit"
            echo ""
            echo '```'
            cat /tmp/messaging.txt 2>/dev/null || echo "(skipped)"
            echo '```'
            echo ""
            echo "Convention + allowlist syntax: see [docs/AUDIT.md]($DOC_URL)."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Fail step if either audit had findings
        if: steps.surface_audit.outputs.exit != '0' || steps.messaging_audit.outputs.exit != '0'
        run: |
          echo "::warning::public-surface or canonical-messaging audit reported findings — see job summary"
          # not failing the job (continue-on-error: true on the job)
          exit 0

  harness-smoke:
    name: harness smoke (counts at thresholds)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install duecare-llm-chat from source
        run: |
          pip install --upgrade pip wheel
          pip install -e packages/duecare-llm-chat
      - name: Smoke-check harness imports + counts
        run: python scripts/verify.py

  harness-lift-gate:
    name: harness lift (no silent regression)
    runs-on: ubuntu-latest
    needs: harness-smoke
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install duecare-llm-chat from source
        run: |
          pip install --upgrade pip wheel
          pip install -e packages/duecare-llm-chat
      - name: Run rubric comparison + assert thresholds
        run: |
          python scripts/rubric_comparison.py \
              --output /tmp/lift.md \
              --json-output /tmp/lift.json
          python - <<'PYEOF'
          import json, sys
          d = json.loads(open("/tmp/lift.json").read())
          dim = d["per_dimension"]
          checks = [
              ("Mean overall lift",      d["overall"]["lift_mean_pp"], 50.0),
              ("Jurisdiction-specific",  dim["1_jurisdiction"]["lift_pp"], 70.0),
              ("ILO / international",    dim["2_ilo_international"]["lift_pp"], 45.0),
              ("Substance-over-form",    dim["3_substance_over_form"]["lift_pp"], 20.0),
          ]
          fails = []
          for name, m, floor in checks:
              status = "OK" if m >= floor else "FAIL"
              print(f"  [{status}] {name:30s} +{m:5.1f} pp (floor +{floor:.1f})")
              if m < floor:
                  fails.append((name, m, floor))
          if fails:
              print()
              print("Lift regressed below documented thresholds.")
              print("Either fix the regression or update writeup_draft.md / FOR_KAGGLE_JUDGES.md / harness_lift_report.md.")
              sys.exit(1)
          PYEOF

  test:
    name: pytest + adversarial
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install uv
        run: pip install uv

      - name: Install workspace (all 17 packages)
        run: |
          uv sync --all-packages --no-install-project --no-install-package forge-workspace
          uv pip install pytest pyyaml

      - name: Run unit + integration suite
        run: uv run --no-sync pytest packages tests -q --no-header

      - name: Adversarial validation
        run: uv run --no-sync python scripts/adversarial_validation.py --all --stress 2

  entity-pipeline:
    name: entity-intelligence suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # The entity-intelligence connectors live under scripts/ and gate their heavy deps
      # behind pytest.importorskip (rapidfuzz / splink / cv2 / pandas / numpy). The main `test`
      # job installs only pyyaml, so these 19 suites SKIP there. This job installs the real deps
      # so they actually RUN -- 207 tests across registry parsing, GLEIF/RR linkage, FtM
      # normalisation, entity screening, clustering, and the entity-count drift guard.
      - name: Install entity-pipeline deps
        run: pip install pytest pyyaml rapidfuzz splink opencv-python-headless pandas numpy

      - name: Run entity-intelligence test suite
        run: |
          python -m pytest -q --no-header \
            tests/test_acquisition_cascade.py tests/test_cluster_registries.py \
            tests/test_doj_press.py tests/test_dol_whd.py tests/test_domain_intel.py \
            tests/test_entity_kb.py tests/test_entity_link.py tests/test_entity_screen.py \
            tests/test_entity_count_drift.py tests/test_entity_edges.py tests/test_ftm_schema.py \
            tests/test_gleif_lei.py tests/test_gleif_rr.py \
            tests/test_harvest_opensanctions_sources.py tests/test_image_enhance.py \
            tests/test_ingest_kaggle_agencies.py tests/test_openownership_bods.py \
            tests/test_opensanctions_to_specs.py tests/test_registry_parsers.py \
            tests/test_registry_spec.py tests/test_tooling_scout.py

      # Belt-and-suspenders for the count source of truth: regenerate the published JSON and
      # fail if it drifts from configs/cascade (test_entity_count_drift covers value equality;
      # this also catches a forgotten `--write` and any byte-level format drift).
      - name: Verify entity_counts.json is current
        run: |
          python scripts/entity_counts.py --write
          git diff --exit-code apps/duecare-ai.com/app/static/entity_counts.json \
            || (echo "::error::entity_counts.json is stale -- run: python scripts/entity_counts.py --write" && exit 1)

  build-wheels:
    name: build 17 wheels
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build
        run: pip install build

      - name: Build all 17 packages
        run: |
          for pkg in packages/duecare-llm-*; do
            echo "::group::Building $pkg"
            python -m build --wheel "$pkg"
            echo "::endgroup::"
          done

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: duecare-wheels-${{ github.sha }}
          path: packages/*/dist/*.whl
          retention-days: 30

  cleanroom:
    name: clean-room install
    runs-on: ubuntu-latest
    needs: build-wheels
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build
        run: pip install build

      - name: Build wheels
        run: |
          for pkg in packages/duecare-llm-*; do
            python -m build --wheel "$pkg"
          done

      - name: Clean-room install smoke test
        run: python scripts/cleanroom_install.py

  notebooks:
    name: execute 4 kaggle notebooks
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Install workspace
        run: |
          uv sync --all-packages --no-install-project --no-install-package forge-workspace
          uv pip install jupyter nbconvert

      - name: Execute each notebook
        run: |
          for nb in kaggle/kernels/duecare_010_quickstart/010_quickstart.ipynb \
                    kaggle/kernels/duecare_200_cross_domain_proof/200_cross_domain_proof.ipynb \
                    kaggle/kernels/duecare_500_agent_swarm_deep_dive/500_agent_swarm_deep_dive.ipynb \
                    kaggle/kernels/duecare_610_submission_walkthrough/610_submission_walkthrough.ipynb; do
            echo "::group::Executing $nb"
            uv run --no-sync jupyter nbconvert --to notebook --execute --inplace "$nb"
            echo "::endgroup::"
          done
