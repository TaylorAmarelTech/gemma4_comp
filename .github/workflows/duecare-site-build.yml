name: duecare-site-build

# Builds both DueCare website handoff artifacts. The first keeps dynamic calls pointed at the
# running Render backend. The second is a validated, backend-free continuity bundle used by the
# dedicated duecare-ai-site Pages repository. This repository keeps its one Pages site for MkDocs.

on:
  push:
    branches: [master]
    paths:
      - "apps/duecare-ai.com/**"
      - ".github/workflows/duecare-site-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/duecare-ai.com
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install site deps (+ HTTP clients for the TestClient renderer)
        run: pip install -r requirements.txt httpx httpx2
      - name: Render static bundle
        run: python scripts/export_static.py --out dist --api-base https://gemma4-comp.onrender.com
      - name: Upload live-backend static site artifact
        uses: actions/upload-artifact@v7
        with:
          name: duecare-ai-static-site
          path: apps/duecare-ai.com/dist
          if-no-files-found: error
      - name: Render backend-free continuity bundle
        run: >-
          python scripts/export_static.py
          --out dist-fallback
          --fallback
          --base-path /duecare-ai-site
          --site-url https://tayloramareltech.github.io/duecare-ai-site
          --source-revision ${{ github.sha }}
          --omit-cname
      - name: Validate backend-free continuity bundle
        run: >-
          python scripts/validate_static_fallback.py
          --site dist-fallback
          --base-path /duecare-ai-site
          --site-url https://tayloramareltech.github.io/duecare-ai-site
      - name: Upload backend-free continuity artifact
        uses: actions/upload-artifact@v7
        with:
          name: duecare-ai-read-only-fallback
          path: apps/duecare-ai.com/dist-fallback
          if-no-files-found: error
