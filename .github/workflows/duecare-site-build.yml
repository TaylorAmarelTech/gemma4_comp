name: duecare-site-build

# Builds the validated, backend-free website bundle. The dedicated duecare-ai-site Pages
# repository serves it at duecare-ai.com, which it took over from the retired paid Render
# service. This repository keeps its one Pages site for MkDocs.
#
# The former live-backend variant (--api-base https://gemma4-comp.onrender.com) is gone with
# the Render service. duecare-ai-site/.github/workflows/pages.yml is the deploying build; this
# job is the in-repo check that a website change still exports and validates.

on:
  push:
    branches: [master]
    paths:
      - "apps/duecare-ai.com/**"
      - ".github/workflows/duecare-site-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/duecare-ai.com
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install site deps (+ HTTP clients for the TestClient renderer)
        run: pip install -r requirements.txt httpx httpx2
      - name: Render backend-free website bundle
        run: >-
          python scripts/export_static.py
          --out dist-fallback
          --fallback
          --site-url https://duecare-ai.com
          --source-revision ${{ github.sha }}
          --cname duecare-ai.com
      - name: Validate backend-free website bundle
        run: >-
          python scripts/validate_static_fallback.py
          --site dist-fallback
          --site-url https://duecare-ai.com
          --expect-cname duecare-ai.com
      - name: Upload backend-free website artifact
        uses: actions/upload-artifact@v7
        with:
          name: duecare-ai-read-only-fallback
          path: apps/duecare-ai.com/dist-fallback
          if-no-files-found: error
