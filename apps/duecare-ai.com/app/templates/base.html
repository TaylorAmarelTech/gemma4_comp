<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}Duecare AI{% endblock %}</title>
  <meta name="description" content="Duecare AI is a privacy-preserving Gemma 4 safety infrastructure hub for migrant-worker protection." />
  <link rel="stylesheet" href="/static/site.css" />
</head>
<body>
<header class="site-header">
  <nav class="nav" aria-label="Main navigation">
    <a class="brand" href="/"><span class="brand-mark" aria-hidden="true"></span><span>Duecare AI</span></a>
    <div class="nav-links">
      <a href="/setup">Setup</a>
      <a href="/components">Components</a>
      <a href="/context">Context</a>
      <a href="/tools">Tools</a>
      <a href="/intelligence">Intelligence</a>
      <a href="/contribute">Contribute</a>
      <a href="/dashboard" class="nav-cta">Live hub</a>
    </div>
  </nav>
</header>
<main>
  {% block content %}{% endblock %}
</main>
<footer class="footer">
  <div class="footer-inner">
    <div>Duecare drafts; the user or trusted caseworker decides. <strong>Privacy is non-negotiable.</strong></div>
    <div class="footer-links">
      <a href="/partners">NGO signup</a>
      <a href="/volunteer">Volunteer</a>
      <a href="/client-connect">Client connect</a>
      <a href="/docs">API docs</a>
    </div>
  </div>
</footer>
{% block scripts %}{% endblock %}
</body>
</html>
