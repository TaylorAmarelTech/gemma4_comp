# Build-from-source override for the local all-in-one stack.
#
# The base docker-compose.yml pulls the published image
# ghcr.io/tayloramareltech/duecare-llm:latest. A fresh clone that cannot pull
# that image (private registry, offline, or a local change to test) uses this
# override to build the DueCare image from the repo's root Dockerfile instead:
#
#     docker compose \
#       -f docker-compose.yml \
#       -f docker-compose.build.yml \
#       up --build
#
# Everything else (ollama, caddy, ports, volumes) is inherited unchanged.

services:
  duecare:
    image: duecare-llm:local
    build:
      context: ../../..
      dockerfile: Dockerfile
