[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "duecare-llm-kit"
version = "0.1.0"
description = "Reusable, downloadable DueCare toolkit: the ILO forced-labour indicator engine, DueCare-styled chart helpers, a self-contained HTML harness-lift report generator, and a data-corpus exporter -- the code embedded in the DueCare Kaggle notebooks, now importable."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [{name = "Taylor Amarel"}]
keywords = ["llm", "safety", "gemma", "duecare", "ilo", "reporting", "visualization", "corpus"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
# Richer charts: seaborn themes + interactive Plotly bars. The core helpers all run without these
# (they fall back to matplotlib), so the extra is opt-in.
viz = [
    "seaborn>=0.13",
    "plotly>=5.18",
    "scipy>=1.11",
]
# Lightweight NLP add-ons for downstream analysis of the corpus / engine output.
nlp = [
    "scikit-learn>=1.3",
    "vaderSentiment>=3.3",
    "textstat>=0.7",
]
all = [
    "seaborn>=0.13",
    "plotly>=5.18",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "vaderSentiment>=3.3",
    "textstat>=0.7",
]

[project.scripts]
duecare-kit-report = "duecare.kit.report:main"
duecare-kit-corpus = "duecare.kit.corpus:main"

[project.urls]
Homepage = "https://github.com/TaylorAmarelTech/gemma4_comp"
Documentation = "https://github.com/TaylorAmarelTech/gemma4_comp/blob/main/packages/duecare-llm-kit/README.md"
Issues = "https://github.com/TaylorAmarelTech/gemma4_comp/issues"
Repository = "https://github.com/TaylorAmarelTech/gemma4_comp"

[tool.hatch.build.targets.wheel]
packages = ["src/duecare"]

[tool.hatch.build.targets.sdist]
include = [
    "src/**/*.py",
    "tests/**/*.py",
    "README.md",
    "pyproject.toml",
]
