[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "duecare-llm-research-tools"
version = "0.1.0"
description = "External-research tool wrappers for the Duecare harness. Includes OpenClaw integration with strict PII filtering and a pluggable ResearchTool protocol for adding more sources (CourtListener, GDELT, etc.)."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [{name = "Taylor Amarel"}]
dependencies = [
    "pydantic>=2.9.0",
    # The research monitor's source registry is YAML; load_sources() needs a
    # real YAML parser (its json fallback cannot parse a .yaml file).
    "pyyaml>=6.0",
]

[project.optional-dependencies]
http = ["httpx>=0.25.0"]
# Bot-grade fetch for the Public Information Research Monitor: curl_cffi
# impersonates a real browser TLS/JA3 fingerprint so government/NGO WAFs do not
# 403 a stdlib request. Optional -- the monitor falls back to stdlib urllib.
fetch = ["curl_cffi>=0.7.0"]
# Headless-browser scraping for JS-walled registries (scripts/browser_scrape.py):
# DMW's licensed-agency inquiry is a Nuxt SPA whose list arrives via XHR, so a
# real browser is needed to render + intercept it. Optional -- only live runs
# need it; the connector's parsing core is tested without a browser.
# After install, run: python -m playwright install chromium
browser = ["playwright>=1.40"]

[project.urls]
Homepage = "https://github.com/TaylorAmarelTech/gemma4_comp"

[tool.hatch.build.targets.wheel]
packages = ["src/duecare"]
