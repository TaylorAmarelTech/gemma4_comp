<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tools layer · DueCare</title>
  <link rel="stylesheet" href="/static/_chrome.css" />
  <style>
    * { box-sizing: border-box; }
    header { padding: 14px 24px; background: var(--paper); border-bottom: 1px solid var(--line-soft); }
    header h1 { margin: 0; font-size: 16px; color: var(--ink); font-weight: 600; letter-spacing: -0.01em; }
    .sub { font-size: 13px; color: var(--ink-3); flex: 1; }
    .container { padding: 32px; max-width: 1200px; margin: 0 auto; }
    section { background: var(--paper); border: 1px solid var(--line); border-radius: 12px;
               padding: 24px; margin-bottom: 18px; }
    section h2 { margin: 0 0 14px; font-size: 11px; color: var(--ink-3);
                  text-transform: uppercase; letter-spacing: 0.08em; font-family: var(--mono);
                  font-weight: 500; }
    .tool { padding: 12px 0; border-bottom: 1px solid var(--line-soft); }
    .tool:last-child { border-bottom: 0; }
    .tool .name { font-family: var(--mono);
                   font-weight: 600; color: var(--ink); font-size: 13.5px; }
    .tool .desc { font-size: 13px; color: var(--ink-3); margin-top: 4px; line-height: 1.5; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 10px;
             border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
    th { text-align: left; padding: 10px 12px; background: var(--paper-2);
          border-bottom: 1px solid var(--line); font-weight: 500; color: var(--ink-3);
          font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; font-family: var(--mono); }
    td { padding: 10px 12px; border-bottom: 1px solid var(--line-soft); vertical-align: top; color: var(--ink-2); }
    code { font-family: var(--mono);
            background: var(--paper-2); color: var(--ink-2);
            padding: 2px 6px; border-radius: 4px; font-size: 12px;
            border: 1px solid var(--line-soft); }
    .empty { color: var(--ink-4); font-style: italic; padding: 8px 0; font-size: 12px; }
    a.back { color: var(--ink-3); font-size: 12px; text-decoration: none; font-family: var(--mono); }
    a.back:hover { color: var(--accent-ink); }
    .err { color: oklch(0.40 0.13 45); padding: 14px; }
  </style>
  <script src="/static/_activity_log.js" defer></script>
  <script src="/static/_nav.js" defer></script>
</head>
<body data-nav="harness">
  <header>
    
    <h1>Tools layer</h1>
    <div class="sub" id="stats">Loading…</div>
  </header>
  <!-- rule 7 (trust boundary): read-only — fetches GET /api/harness-catalog/tools from the local kernel only; no user data sent, nothing written. -->
  <div class="dc-trust-row" role="note" aria-label="Trust boundary" style="margin: 12px 32px 0; max-width: 1200px;">
    <span class="dc-trust-pill"><span class="dot"></span>LOCAL</span>
    <span class="dc-trust-pill"><span class="dot"></span>READ-ONLY</span>
    <span class="dc-trust-text">This page fetches the list of function-calling
    tools and backing knowledge tables from the local kernel only.
    No user data is sent and nothing is written.</span>
  </div>
  <div class="dc-activity-log" id="tools-log" style="margin: 12px 32px 0; max-width: 1200px;">
    <div class="dc-log-idle">Waiting for tools catalog…</div>
  </div>
  <div class="container" id="root">Loading…</div>
  <script>
    function escapeHtml(s) {
      return String(s == null ? "" : s).replace(/[&<>"']/g, c =>
        ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }
    /**
     * Serialize an API value to an HTML string.
     * IMPORTANT: returns raw HTML including wrapper tags.
     * All string/number/boolean leaf values are passed through escapeHtml().
     * Callers must assign the result only via innerHTML, never via textContent.
     * Do NOT add branches that embed server-supplied data without escapeHtml().
     */
    function jsonValue(v, depth = 0) {
      if (v == null) return '<span class="empty">—</span>';
      if (typeof v === "string" || typeof v === "number" || typeof v === "boolean") {
        return escapeHtml(String(v));
      }
      if (Array.isArray(v)) {
        return v.map(x => jsonValue(x, depth + 1)).join(", ");
      }
      // object — show keys: values
      return Object.entries(v).map(([k, val]) =>
        `<div><strong>${escapeHtml(k)}</strong>: ${jsonValue(val, depth + 1)}</div>`).join("");
    }
    function tableFromObject(title, obj) {
      if (!obj) return "";
      const entries = Object.entries(obj);
      if (!entries.length) return "";
      return `<section>
        <h2>${escapeHtml(title)} <span style="color:var(--ink-3); font-weight:400; font-size:11px; font-family:var(--mono);">(${entries.length})</span></h2>
        <table>
          <thead><tr><th>Key</th><th>Value</th></tr></thead>
          <tbody>
            ${entries.map(([k, v]) => `
              <tr><td><code>${escapeHtml(k)}</code></td><td>${jsonValue(v)}</td></tr>
            `).join("")}
          </tbody>
        </table>
      </section>`;
    }
    function tableFromArray(title, arr) {
      if (!arr || !arr.length) return "";
      const cols = Object.keys(arr[0] || {});
      if (!cols.length) {
        return `<section><h2>${escapeHtml(title)} (${arr.length})</h2>
          <ul>${arr.map(x => `<li>${escapeHtml(String(x))}</li>`).join("")}</ul></section>`;
      }
      return `<section>
        <h2>${escapeHtml(title)} <span style="color:var(--ink-3); font-weight:400; font-size:11px; font-family:var(--mono);">(${arr.length})</span></h2>
        <table>
          <thead><tr>${cols.map(c => `<th>${escapeHtml(c)}</th>`).join("")}</tr></thead>
          <tbody>
            ${arr.map(row => `<tr>${cols.map(c =>
              `<td>${jsonValue(row[c])}</td>`).join("")}</tr>`).join("")}
          </tbody>
        </table>
      </section>`;
    }
    const log = window.dcActivityLog
      ? window.dcActivityLog.attach('#tools-log', {idlePlaceholder: 'Waiting for tools catalog…'})
      : null;

    async function load() {
      log && log.step('GET /api/harness-catalog/tools');
      let d;
      try {
        const r = await fetch("/api/harness-catalog/tools", {cache: "no-store"});
        if (!r.ok) throw new Error("HTTP " + r.status);
        d = await r.json();
        log && log.ok('catalog loaded', `${(d.items || []).length} tools`);
      } catch (e) {
        log && log.err(e.message);
        document.getElementById("root").innerHTML =
          `<div class="err">${escapeHtml(e.message)}</div>`;
        return;
      }
      const tools = d.items || [];
      const tables = d.tables || {};
      let html = `
        <section>
          <h2>Function-calling tools <span style="color:var(--ink-3); font-weight:400; font-size:11px; font-family:var(--mono);">(${tools.length})</span></h2>
          ${tools.map(t => `
            <div class="tool">
              <div class="name">${escapeHtml(t.name)}</div>
              <div class="desc">${escapeHtml(t.description || '') || '&lt;no docstring&gt;'}</div>
            </div>
          `).join("") || '<div class="empty">No tools wired.</div>'}
        </section>
      `;
      // Render the backing tables Gemma queries via these tools.
      html += tableFromObject("Corridor fee caps (corridor → cap details)", tables.corridor_fee_caps);
      html += tableFromObject("Fee camouflage labels (label → underlying prohibited fee)", tables.fee_camouflage_labels);
      html += tableFromArray("ILO Forced-Labour Indicators (1–11)", tables.ilo_indicators);
      html += tableFromObject("NGO intake groups (corridor → NGO contacts)", tables.ngo_intake_groups);
      html += tableFromObject("ILO Conventions (number → description)", tables.ilo_conventions);
      document.getElementById("root").innerHTML = html;
      const totalRows = (tools.length)
        + Object.keys(tables.corridor_fee_caps || {}).length
        + Object.keys(tables.fee_camouflage_labels || {}).length
        + (tables.ilo_indicators || []).length
        + Object.keys(tables.ngo_intake_groups || {}).length
        + Object.keys(tables.ilo_conventions || {}).length;
      document.getElementById("stats").textContent =
        `${tools.length} tools · ${totalRows - tools.length} backing-table rows`;
    }
    load();
  </script>
</body>
</html>
