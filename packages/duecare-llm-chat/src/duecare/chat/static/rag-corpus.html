<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RAG corpus · DueCare</title>
  <link rel="stylesheet" href="/static/_chrome.css" />
  <style>
    * { box-sizing: border-box; }
    header { padding: 14px 24px; background: var(--paper); border-bottom: 1px solid var(--line-soft);
              display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
    header h1 { margin: 0; font-size: 16px; color: var(--ink); font-weight: 600; letter-spacing: -0.01em; }
    .sub { font-size: 13px; color: var(--ink-3); flex: 1; }
    input, select { padding: 7px 11px; font-size: 13px; border: 1px solid var(--line);
                     background: var(--paper); color: var(--ink); border-radius: 6px;
                     font-family: var(--sans); }
    input:focus, select:focus { outline: 0; border-color: var(--accent);
                box-shadow: 0 0 0 4px oklch(0.85 0.05 195 / 0.3); }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 12px 24px;
             background: var(--paper-2); border-bottom: 1px solid var(--line-soft); }
    .chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px;
             border-radius: 999px; font-size: 12px; cursor: pointer; user-select: none;
             border: 1px solid var(--line); background: var(--paper); color: var(--ink-2); }
    .chip .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; }
    .chip:hover { border-color: var(--ink-3); }
    .chip.active { font-weight: 600; background: var(--ink); color: var(--paper); border-color: var(--ink); }
    .chip .n { color: var(--ink-4); font-size: 11px; }
    .chip.active .n { color: var(--paper-3); }
    .recent-banner { padding: 10px 24px; background: oklch(0.96 0.04 80);
                      border-bottom: 1px solid oklch(0.85 0.06 80); font-size: 12.5px;
                      color: oklch(0.40 0.10 80); display: none; }
    .recent-banner.show { display: block; }
    .container { padding: 24px; max-width: 1450px; margin: 0 auto; }
    .grid { display: grid; grid-template-columns: 1fr 1.4fr; gap: 16px; }
    .list { background: var(--paper); border: 1px solid var(--line); border-radius: 12px;
             overflow-y: auto; max-height: calc(100vh - 180px); }
    .item { padding: 12px 16px; border-bottom: 1px solid var(--line-soft); cursor: pointer;
             position: relative; }
    .item:hover { background: var(--paper-2); }
    .item.active { background: var(--accent-soft); border-left: 3px solid var(--accent); }
    .item.recent::after { content: "● recent"; position: absolute; right: 12px; top: 12px;
                          color: oklch(0.40 0.10 80); font-size: 10px; font-weight: 600;
                          font-family: var(--mono); text-transform: uppercase; letter-spacing: 0.06em; }
    .item .id { font-family: var(--mono);
                 font-size: 11px; color: var(--ink-3); }
    .item .title { margin-top: 4px; font-size: 13.5px; font-weight: 600; color: var(--ink); }
    .item .source { margin-top: 3px; font-size: 11.5px; color: var(--ink-3); }
    .item .group-pill { display: inline-block; padding: 2px 8px; border-radius: 4px;
                         font-size: 10px; margin-top: 6px; font-weight: 500;
                         font-family: var(--mono); text-transform: uppercase; letter-spacing: 0.06em; }
    .detail { background: var(--paper); border: 1px solid var(--line); border-radius: 12px;
               padding: 24px; max-height: calc(100vh - 180px); overflow-y: auto; }
    .detail .id-tag { font-family: var(--mono);
                       font-size: 11.5px; color: var(--ink-3); }
    .detail h2 { margin: 8px 0 10px; font-size: 18px; color: var(--ink); letter-spacing: -0.012em; }
    .detail .source-tag { font-size: 12px; color: var(--ink-3); margin-bottom: 8px; }
    .detail .group-tag { display: inline-block; padding: 3px 8px; border-radius: 4px;
                          font-size: 10.5px; margin-bottom: 16px; font-weight: 500;
                          font-family: var(--mono); text-transform: uppercase; letter-spacing: 0.06em; }
    .detail .snippet { font-size: 14px; line-height: 1.65; color: var(--ink-2);
                        white-space: pre-wrap; }
    .citation-block { margin-top: 18px; padding-top: 14px;
                       border-top: 1px solid var(--line-soft); }
    .citation-block h3 { margin: 0 0 10px; font-size: 11px; color: var(--ink-3);
                          text-transform: uppercase; letter-spacing: 0.08em; font-family: var(--mono); }
    .citation-list { margin: 0; padding: 0 0 0 16px; font-size: 13px; color: var(--ink-2); }
    .citation-list li { margin-bottom: 6px; line-height: 1.5; }
    .citation-list .relation { color: var(--ink-3); }
    .citation-list .note { color: var(--ink-3); font-style: italic; font-size: 11.5px; margin-top: 2px; }
    .citation-list code { background: var(--accent-soft); color: var(--accent-ink);
                           padding: 2px 6px; border-radius: 4px; font-size: 11.5px;
                           border: 1px solid oklch(0.88 0.04 195); }
    .placeholder { color: var(--ink-3); font-style: italic; }
    a.back { color: var(--ink-3); font-size: 12px; text-decoration: none; font-family: var(--mono); }
    a.back:hover { color: var(--accent-ink); }
    .err { color: oklch(0.40 0.13 45); padding: 14px; }
    @media (max-width: 800px) { .grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header>
    <a href="/static/harness.html" class="back">← All layers</a>
    <h1>RAG corpus</h1>
    <div class="sub" id="stats">Loading…</div>
    <input id="search" type="text" placeholder="Search id / title / source / snippet…" />
    <a href="/static/rag-graph.html" class="back" target="_blank" style="color:var(--accent-ink);">↗ View as graph</a>
  </header>
  <div class="chips" id="chips"></div>
  <div class="recent-banner" id="recent-banner"></div>
  <div class="container">
    <div class="grid">
      <div class="list" id="list"></div>
      <div class="detail" id="detail">
        <div class="placeholder">Click any document to view full content + citation neighbors.</div>
      </div>
    </div>
  </div>
  <script>
    let rows = [], filt = "", activeGroup = "", activeId = null;
    let recentQuery = null;
    function escapeHtml(s) {
      return String(s == null ? "" : s).replace(/[&<>"']/g, c =>
        ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }
    async function load() {
      try {
        const r = await fetch("/api/harness-catalog/rag", {cache: "no-store"});
        if (!r.ok) throw new Error("HTTP " + r.status);
        const d = await r.json();
        rows = d.items || [];
        recentQuery = d.recent_query || null;
        document.getElementById("stats").textContent = `${d.n_items || rows.length} documents`;
        const banner = document.getElementById("recent-banner");
        if (recentQuery) {
          const recentIds = rows.filter(x => x.recently_retrieved).map(x => x.id);
          if (recentIds.length) {
            banner.innerHTML = `<strong>Last retrieval:</strong> ${recentIds.length} document(s) pulled for the most recent chat turn — query: <em>${escapeHtml(recentQuery)}</em>. <a href="#" onclick="filterRecent(); return false;" style="color:#fbbf24;">Show only those →</a>`;
            banner.classList.add("show");
          }
        }
      } catch (e) {
        document.getElementById("list").innerHTML = `<div class="err">${escapeHtml(e.message)}</div>`;
        return;
      }
      // Build jurisdiction chips from the data
      const groups = {};
      for (const r of rows) {
        const k = r.group || "other";
        if (!groups[k]) groups[k] = {label: r.group_label || "Other", color: r.group_color || "#94a3b8", count: 0};
        groups[k].count++;
      }
      const sorted = Object.entries(groups).sort((a, b) => b[1].count - a[1].count);
      document.getElementById("chips").innerHTML =
        `<span class="chip ${activeGroup === '' ? 'active' : ''}" onclick="setGroup('')">All <span class="n">(${rows.length})</span></span>` +
        sorted.map(([gid, g]) => `
          <span class="chip ${activeGroup === gid ? 'active' : ''}" onclick="setGroup('${escapeHtml(gid)}')"
                style="background:${g.color}1f; border-color:${g.color};">
            <span class="dot" style="background:${g.color};"></span>
            ${escapeHtml(g.label)} <span class="n">(${g.count})</span>
          </span>
        `).join("");
      document.getElementById("search").addEventListener("input", e => { filt = e.target.value; render(); });
      render();
    }
    function setGroup(gid) { activeGroup = gid; load_chips(); render(); }
    function load_chips() {
      document.querySelectorAll(".chip").forEach(c => c.classList.toggle("active",
        (activeGroup === "" && c.textContent.startsWith("All ")) ||
        (c.getAttribute("onclick") || "").includes(`'${activeGroup}'`)));
    }
    function filterRecent() {
      filt = "";
      document.getElementById("search").value = "";
      activeGroup = "_recent_";
      render();
    }
    function render() {
      const q = filt.toLowerCase().trim();
      const visible = rows.filter(r => {
        if (activeGroup === "_recent_") return r.recently_retrieved;
        if (activeGroup && r.group !== activeGroup) return false;
        if (!q) return true;
        return (r.id || "").toLowerCase().includes(q)
            || (r.title || "").toLowerCase().includes(q)
            || (r.source || "").toLowerCase().includes(q)
            || (r.snippet || "").toLowerCase().includes(q);
      });
      document.getElementById("list").innerHTML = visible.map(r => `
        <div class="item ${r.id === activeId ? "active" : ""} ${r.recently_retrieved ? "recent" : ""}" onclick="select('${escapeHtml(r.id)}')">
          <div class="id">${escapeHtml(r.id)}</div>
          <div class="title">${escapeHtml(r.title)}</div>
          <div class="source">${escapeHtml(r.source)}</div>
          <span class="group-pill" style="background:${r.group_color}1f; color:${r.group_color}; border:1px solid ${r.group_color};">${escapeHtml(r.group_label || "")}</span>
        </div>
      `).join("") || `<div class="placeholder" style="padding:14px;">No matches.</div>`;
      document.getElementById("stats").textContent = `${visible.length} of ${rows.length} documents`;
    }
    function select(id) {
      activeId = id;
      const doc = rows.find(r => r.id === id);
      if (!doc) return;
      const cites_out = doc.cites_out || [];
      const cites_in = doc.cites_in || [];
      const out_html = cites_out.length ? `
        <div class="citation-block">
          <h3>Cites → (${cites_out.length})</h3>
          <ul class="citation-list">
            ${cites_out.map(e => `<li><span class="relation">${escapeHtml((e.relation || "").replace(/_/g, ' '))}</span> → <code>${escapeHtml(e.to)}</code>
              ${e.note ? `<div class="note">${escapeHtml(e.note)}</div>` : ""}
            </li>`).join("")}
          </ul>
        </div>` : "";
      const in_html = cites_in.length ? `
        <div class="citation-block">
          <h3>← Cited by (${cites_in.length})</h3>
          <ul class="citation-list">
            ${cites_in.map(e => `<li><code>${escapeHtml(e.from)}</code> <span class="relation">${escapeHtml((e.relation || "").replace(/_/g, ' '))}</span>
              ${e.note ? `<div class="note">${escapeHtml(e.note)}</div>` : ""}
            </li>`).join("")}
          </ul>
        </div>` : "";
      document.getElementById("detail").innerHTML = `
        <div class="id-tag">${escapeHtml(doc.id)}</div>
        <h2>${escapeHtml(doc.title)}</h2>
        <div class="source-tag">${escapeHtml(doc.source)}</div>
        <span class="group-tag" style="background:${doc.group_color}1f; color:${doc.group_color}; border:1px solid ${doc.group_color};">
          ${escapeHtml(doc.group_label || "")}
        </span>
        ${doc.recently_retrieved ? '<span class="group-tag" style="background:rgba(251,191,36,0.18); color:#fbbf24; border:1px solid #fbbf24; margin-left:6px;">↻ pulled for last chat turn</span>' : ""}
        <div class="snippet">${escapeHtml(doc.snippet)}</div>
        ${out_html}
        ${in_html}
      `;
      render();
    }
    load();
    // Auto-refresh every 8s so a chat turn updates the "recently_retrieved" badges live.
    setInterval(load, 8000);
  </script>
</body>
</html>
