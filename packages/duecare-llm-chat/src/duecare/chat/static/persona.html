<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Persona library · DueCare</title>
  <link rel="stylesheet" href="/static/_chrome.css" />
  <style>
    :root {
      --ink: #e2e8f0; --muted: #94a3b8; --bg: #0f172a; --panel: #1e293b;
      --border: #334155; --accent: #a855f7;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink);
                  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                               Helvetica, Arial, sans-serif; }
    header { padding: 14px 20px; background: var(--panel); border-bottom: 1px solid var(--border);
              display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
    header h1 { margin: 0; font-size: 16px; color: var(--accent); }
    .sub { font-size: 12px; color: var(--muted); flex: 1; }
    input { padding: 6px 10px; font-size: 12px; border: 1px solid var(--border);
             background: var(--bg); color: var(--ink); border-radius: 4px; min-width: 220px; }
    .container { padding: 18px 24px; max-width: 1100px; margin: 0 auto; }
    .grid { display: grid; grid-template-columns: 1fr 1.4fr; gap: 16px; }
    .list { background: var(--panel); border: 1px solid var(--border); border-radius: 6px;
             overflow-y: auto; max-height: calc(100vh - 110px); }
    .item { padding: 10px 14px; border-bottom: 1px solid var(--border); cursor: pointer; }
    .item:hover { background: rgba(168,85,247,0.08); }
    .item.active { background: rgba(168,85,247,0.15); border-left: 3px solid var(--accent); }
    .item .name { font-size: 13px; font-weight: 600; }
    .item .role { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .detail { background: var(--panel); border: 1px solid var(--border); border-radius: 6px;
               padding: 22px; max-height: calc(100vh - 110px); overflow-y: auto; }
    .detail h2 { margin: 0 0 6px; font-size: 16px; }
    .detail .role-tag { font-size: 11px; color: var(--muted); }
    .detail .system-prompt { font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
                              font-size: 11.5px; color: #cbd5e1; white-space: pre-wrap;
                              line-height: 1.6; background: rgba(168,85,247,0.05);
                              padding: 14px; border-radius: 4px; margin-top: 14px;
                              border-left: 3px solid var(--accent); }
    .placeholder { color: var(--muted); font-style: italic; }
    a.back { color: var(--muted); font-size: 11px; text-decoration: none; }
    a.back:hover { color: var(--accent); }
    .err { color: #ef4444; }
    @media (max-width: 800px) { .grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header>
    <a href="/static/harness.html" class="back">← All layers</a>
    <h1>Persona library</h1>
    <div class="sub" id="stats">Loading…</div>
    <input id="search" type="text" placeholder="Search persona…" />
  </header>
  <div class="container">
    <div class="grid">
      <div class="list" id="list"></div>
      <div class="detail" id="detail">
        <div class="placeholder">Click any persona to view its system prompt.</div>
      </div>
    </div>
  </div>
  <script>
    let rows = [], filt = "", activeId = null;
    function escapeHtml(s) {
      return String(s == null ? "" : s).replace(/[&<>"']/g, c =>
        ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }
    async function load() {
      try {
        const r = await fetch("/api/harness-catalog/persona", {cache: "no-store"});
        if (!r.ok) throw new Error("HTTP " + r.status);
        const d = await r.json();
        rows = d.items || [];
        document.getElementById("stats").textContent =
          `${d.n_items || rows.length} personas — schema ${d.schema || "?"}@${d.version || "?"}`;
      } catch (e) {
        document.getElementById("list").innerHTML = `<div class="err">${escapeHtml(e.message)}</div>`;
        return;
      }
      document.getElementById("search").addEventListener("input", e => { filt = e.target.value; render(); });
      render();
    }
    function render() {
      const q = filt.toLowerCase().trim();
      const visible = rows.filter(r => {
        if (!q) return true;
        return JSON.stringify(r).toLowerCase().includes(q);
      });
      document.getElementById("list").innerHTML = visible.map((r, i) => {
        const id = r.id || r.name || `p${i}`;
        return `<div class="item ${id === activeId ? "active" : ""}" onclick="select('${escapeHtml(id)}')">
          <div class="name">${escapeHtml(r.label || r.name || id)}</div>
          <div class="role">${escapeHtml(r.role || r.summary || "")}</div>
        </div>`;
      }).join("") || `<div class="placeholder" style="padding:14px;">No matches.</div>`;
      document.getElementById("stats").textContent = `${visible.length} of ${rows.length} personas`;
    }
    function select(id) {
      activeId = id;
      const p = rows.find((r, i) => (r.id || r.name || `p${i}`) === id);
      if (!p) return;
      document.getElementById("detail").innerHTML = `
        <div class="role-tag">${escapeHtml(p.role || "system prompt")}</div>
        <h2>${escapeHtml(p.label || p.name || id)}</h2>
        ${p.summary ? `<div style="font-size:12px; color:var(--muted); margin-top:4px;">${escapeHtml(p.summary)}</div>` : ""}
        <div class="system-prompt">${escapeHtml(p.system_prompt || p.prompt || JSON.stringify(p, null, 2))}</div>
      `;
      render();
    }
    load();
  </script>
</body>
</html>
