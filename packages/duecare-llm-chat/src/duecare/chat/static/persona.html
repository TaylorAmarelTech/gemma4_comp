<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Persona library · DueCare</title>
  <link rel="stylesheet" href="/static/_chrome.css" />
  <style>
    * { box-sizing: border-box; }
    header { padding: 14px 24px; background: var(--paper); border-bottom: 1px solid var(--line-soft);
              display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
    header h1 { margin: 0; font-size: 16px; color: var(--ink); font-weight: 600; letter-spacing: -0.01em; }
    .sub { font-size: 13px; color: var(--ink-3); flex: 1; }
    input { padding: 7px 11px; font-size: 13px; border: 1px solid var(--line);
             background: var(--paper); color: var(--ink); border-radius: 6px; min-width: 220px;
             font-family: var(--sans); }
    input:focus { outline: 0; border-color: var(--accent);
             box-shadow: 0 0 0 4px oklch(0.85 0.05 195 / 0.3); }
    .container { padding: 24px 32px; max-width: 1200px; margin: 0 auto; }
    .grid { display: grid; grid-template-columns: 1fr 1.4fr; gap: 16px; }
    .list { background: var(--paper); border: 1px solid var(--line); border-radius: 12px;
             overflow-y: auto; max-height: calc(100vh - 110px); }
    .item { padding: 12px 16px; border-bottom: 1px solid var(--line-soft); cursor: pointer; }
    .item:hover { background: var(--paper-2); }
    .item.active { background: var(--ember-soft); border-left: 3px solid var(--ember); }
    .item .name { font-size: 14px; font-weight: 600; color: var(--ink); }
    .item .role { font-size: 12px; color: var(--ink-3); margin-top: 3px; }
    .detail { background: var(--paper); border: 1px solid var(--line); border-radius: 12px;
               padding: 24px; max-height: calc(100vh - 110px); overflow-y: auto; }
    .detail h2 { margin: 4px 0 6px; font-size: 18px; color: var(--ink); letter-spacing: -0.012em; }
    .detail .role-tag { font-size: 11px; color: var(--ink-3); font-family: var(--mono);
                          text-transform: uppercase; letter-spacing: 0.08em; }
    .detail .system-prompt { font-family: var(--mono);
                              font-size: 13px; color: var(--ink-2); white-space: pre-wrap;
                              line-height: 1.65; background: var(--ember-soft);
                              padding: 16px; border-radius: 8px; margin-top: 14px;
                              border-left: 3px solid var(--ember); }
    .placeholder { color: var(--ink-3); font-style: italic; }
    a.back { color: var(--ink-3); font-size: 12px; text-decoration: none; font-family: var(--mono); }
    a.back:hover { color: var(--accent-ink); }
    .err { color: oklch(0.40 0.13 45); padding: 14px; }
    @media (max-width: 800px) { .grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header>
    <a href="/static/harness.html" class="back">← All layers</a>
    <h1>Persona library</h1>
    <div class="sub" id="stats">Loading…</div>
    <input id="search" type="text" placeholder="Search persona…" />
  </header>
  <div class="container">
    <div class="grid">
      <div class="list" id="list"></div>
      <div class="detail" id="detail">
        <div class="placeholder">Click any persona to view its system prompt.</div>
      </div>
    </div>
  </div>
  <script>
    let rows = [], filt = "", activeId = null;
    function escapeHtml(s) {
      return String(s == null ? "" : s).replace(/[&<>"']/g, c =>
        ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }
    async function load() {
      try {
        const r = await fetch("/api/harness-catalog/persona", {cache: "no-store"});
        if (!r.ok) throw new Error("HTTP " + r.status);
        const d = await r.json();
        rows = d.items || [];
        document.getElementById("stats").textContent =
          `${d.n_items || rows.length} personas — schema ${d.schema || "?"}@${d.version || "?"}`;
      } catch (e) {
        document.getElementById("list").innerHTML = `<div class="err">${escapeHtml(e.message)}</div>`;
        return;
      }
      document.getElementById("search").addEventListener("input", e => { filt = e.target.value; render(); });
      render();
    }
    function render() {
      const q = filt.toLowerCase().trim();
      const visible = rows.filter(r => {
        if (!q) return true;
        return JSON.stringify(r).toLowerCase().includes(q);
      });
      document.getElementById("list").innerHTML = visible.map((r, i) => {
        const id = r.id || r.name || `p${i}`;
        return `<div class="item ${id === activeId ? "active" : ""}" onclick="select('${escapeHtml(id)}')">
          <div class="name">${escapeHtml(r.label || r.name || id)}</div>
          <div class="role">${escapeHtml(r.role || r.summary || "")}</div>
        </div>`;
      }).join("") || `<div class="placeholder" style="padding:14px;">No matches.</div>`;
      document.getElementById("stats").textContent = `${visible.length} of ${rows.length} personas`;
    }
    function select(id) {
      activeId = id;
      const p = rows.find((r, i) => (r.id || r.name || `p${i}`) === id);
      if (!p) return;
      document.getElementById("detail").innerHTML = `
        <div class="role-tag">${escapeHtml(p.role || "system prompt")}</div>
        <h2>${escapeHtml(p.label || p.name || id)}</h2>
        ${p.summary ? `<div style="font-size:13px; color:var(--ink-3); margin-top:4px;">${escapeHtml(p.summary)}</div>` : ""}
        <div class="system-prompt">${escapeHtml(p.system_prompt || p.prompt || JSON.stringify(p, null, 2))}</div>
      `;
      render();
    }
    load();
  </script>
</body>
</html>
