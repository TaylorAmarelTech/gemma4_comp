<!--
  DueCare Exploration Workbench — shared top chrome.

  Three layers, top to bottom:
    1. Status strip — model name, package version, GPU/state, shutdown.
       Persistent system info; not navigation.
    2. Nav bar — brand (links home/playground) + 5 audience tabs +
       right-aligned Tools utility link. Mirrors the duecare-ai.com
       single-row nav pattern.
    3. (Page content renders below this partial.)

  How it loads:
    Each viewer page includes <script src="/static/_nav.js" defer></script>
    which fetches this partial and inserts it as the first child of
    <body>. The active nav link is determined by <body data-nav="<key>">.
    The status strip auto-populates from /api/model-info + /api/version.

  Source-of-truth pattern: matches apps/duecare-ai.com/app/templates/_nav.html
-->
<div class="dc-wb-shell">

  <!-- Layer 1: status strip (informational) -->
  <div class="dc-wb-status" role="status" aria-live="polite">
    <div class="dc-wb-status-inner">
      <span class="dc-wb-status-item dc-wb-status-model">
        <span class="dc-wb-status-dot" id="dc-wb-status-dot" aria-hidden="true"></span>
        <span class="dc-wb-status-label">Model</span>
        <span class="dc-wb-status-value" id="dc-wb-status-model">checking…</span>
      </span>
      <span class="dc-wb-status-sep" aria-hidden="true">·</span>
      <span class="dc-wb-status-item">
        <span class="dc-wb-status-label">Version</span>
        <span class="dc-wb-status-value" id="dc-wb-status-version">—</span>
      </span>
      <span class="dc-wb-status-sep" aria-hidden="true">·</span>
      <span class="dc-wb-status-item dc-wb-status-mem">
        <span class="dc-wb-status-label">GPU</span>
        <span class="dc-wb-status-value" id="dc-wb-status-gpu">—</span>
      </span>
      <button type="button" class="dc-wb-status-shutdown"
              id="dc-wb-shutdown-btn"
              title="Stop the kernel and release GPU memory"
              aria-label="Shutdown kernel">
        <span aria-hidden="true">⏻</span> Shutdown
      </button>
    </div>
  </div>

  <!-- Layer 2: navigation -->
  <nav class="dc-wb-nav" aria-label="Workbench navigation">
    <div class="dc-wb-nav-inner">
      <a href="/" class="dc-wb-brand" aria-label="DueCare Exploration Workbench — home / playground">
        <span class="dc-wb-brand-mark">D</span>
        <span class="dc-wb-brand-text">
          <span class="dc-wb-brand-name">DueCare</span>
          <span class="dc-wb-brand-tag">Workbench</span>
        </span>
      </a>

      <div class="dc-wb-nav-links" id="dc-wb-nav-links">
        <a href="/static/showcase-platform.html"   data-nav-key="platform">Platform safety</a>
        <a href="/static/showcase-ngo.html"        data-nav-key="ngo">NGO &amp; regulator</a>
        <a href="/static/showcase-worker.html"     data-nav-key="worker">Individual worker</a>
        <a href="/static/showcase-researcher.html" data-nav-key="researcher">Researcher</a>
        <a href="/static/showcase-developer.html"  data-nav-key="developer">Developer</a>
      </div>

      <a href="/#compare" class="dc-wb-nav-utility"
         data-nav-key="compare"
         title="A/B compare: same prompt, two harness configs, side-by-side grades"
         >A/B Compare <span aria-hidden="true">★</span></a>
      <a href="/static/all-tools.html" class="dc-wb-nav-utility"
         data-nav-key="tools">Tools <span aria-hidden="true">→</span></a>

      <button type="button" class="dc-wb-nav-toggle"
              aria-label="Toggle navigation"
              onclick="document.body.classList.toggle('dc-wb-nav-open')">
        <span aria-hidden="true">☰</span>
      </button>
    </div>
  </nav>

</div>
