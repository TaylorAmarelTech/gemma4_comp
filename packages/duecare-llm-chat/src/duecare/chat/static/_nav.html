<!--
  DueCare workbench — single pinned status banner.

  This partial is intentionally minimal: one horizontal strip at the
  very top with model state, version, GPU info, a Shutdown button,
  and a deep-link out to duecare-ai.com. The kernel is NOT a
  recreation of the public website, so we don't surface the 5
  audience lane pages from here — those live at duecare-ai.com and
  reviewers reach them via the link.

  Earlier versions of this file rendered a second navigation row
  with 5 audience tabs (Platform safety / NGO & regulator /
  Individual worker / Researcher / Developer). Removed 2026-05-12
  per Taylor's feedback: that row duplicated the website and
  produced the "two horizontal nav bars" bug stacked with
  index.html's page-local toolbar.

  How it loads:
    Each viewer page includes <script src="/static/_nav.js" defer></script>
    which fetches this partial and inserts it as the first child of
    <body>. The status strip auto-populates from /api/model-info +
    /api/version on a light 8-second poll.
-->
<div class="dc-wb-shell">

  <!-- Layer 1: status strip (informational) -->
  <div class="dc-wb-status" role="status" aria-live="polite">
    <div class="dc-wb-status-inner">
      <span class="dc-wb-status-item dc-wb-status-model">
        <span class="dc-wb-status-dot" id="dc-wb-status-dot" aria-hidden="true"></span>
        <span class="dc-wb-status-label">Model</span>
        <span class="dc-wb-status-value" id="dc-wb-status-model">checking…</span>
      </span>
      <span class="dc-wb-status-sep" aria-hidden="true">·</span>
      <span class="dc-wb-status-item">
        <span class="dc-wb-status-label">Version</span>
        <span class="dc-wb-status-value" id="dc-wb-status-version">—</span>
      </span>
      <span class="dc-wb-status-sep" aria-hidden="true">·</span>
      <span class="dc-wb-status-item dc-wb-status-mem">
        <span class="dc-wb-status-label">GPU</span>
        <span class="dc-wb-status-value" id="dc-wb-status-gpu">—</span>
      </span>
      <a href="https://gemma4-comp.onrender.com/"
         target="_blank"
         rel="noopener"
         class="dc-wb-status-item dc-wb-status-website"
         title="Open the live DueCare hub (gemma4-comp.onrender.com; moving to duecare-ai.com)">
        DueCare hub <span aria-hidden="true">↗</span>
      </a>
      <button type="button" class="dc-wb-status-clearchat"
              id="dc-wb-clearchat-btn"
              title="Clear the current chat thread (chat page only)"
              aria-label="Clear chat"
              hidden>
        Clear chat
      </button>
      <button type="button" class="dc-wb-status-shutdown"
              id="dc-wb-shutdown-btn"
              title="Stop the kernel and release GPU memory"
              aria-label="Shutdown kernel">
        <span aria-hidden="true">⏻</span> Shutdown
      </button>
    </div>
  </div>

  <!--
    Layer 2: kernel workflow tabs.

    These are NOT the public-website audience pages (those were
    intentionally removed 2026-05-12). These tabs are the 5 actual
    workflows the kernel supports:

      Chat       free-form chat with any harness toggle combination
      Compare    A/B same prompt, two harness configs, side-by-side
      Upload     drop a ZIP / CSV / case files for batch processing
      Insights   Gemma-guided summaries + GREP/RAG graph viz
      Submit     anonymize + queue facts for upload to duecare-ai.com

    Each page is self-contained inside the kernel. No content here
    duplicates the public website's marketing pages.
  -->
  <nav class="dc-wb-nav" aria-label="Workbench workflows">
    <div class="dc-wb-nav-inner">
      <div class="dc-wb-nav-links" id="dc-wb-nav-links">
        <a href="/static/getting-started.html"   data-nav-key="getting-started"
           title="What this workbench is, what each layer does, and how to read a grade">Getting Started</a>
        <a href="/"                              data-nav-key="chat"
           title="Free-form chat against the loaded Gemma 4 model with any harness combination">Chat</a>
        <a href="/static/compare.html"           data-nav-key="compare"
           title="A/B compare: same prompt, two harness configs, side-by-side grades">Harness Comparison</a>
        <a href="/static/process.html"           data-nav-key="process"
           title="Upload a ZIP/folder; build a local knowledge graph; chat against it">Process Files</a>
        <a href="/static/knowledge.html"         data-nav-key="knowledge"
           title="Paste text; Gemma 4 drafts a standardized knowledge module">Knowledge Extraction</a>
        <a href="/static/search.html"            data-nav-key="search"
           title="Web search via SearXNG / Tavily / Brave; client-triggered, optional anonymize-query">Search</a>
        <a href="/static/share.html"             data-nav-key="share"
           title="Review, redact, and submit anonymized knowledge to the public hub">Anonymization &amp; Sharing</a>
        <a href="/static/sync.html"              data-nav-key="sync"
           title="Pull vetted + unvetted knowledge from the public hub into the local kernel">Sync</a>
        <a href="/static/status.html"            data-nav-key="status"
           title="Local instance health: knowledge counts, sync history, backend availability, model state">Status</a>
      </div>
      <a href="/static/harness.html"             class="dc-wb-nav-utility"
         data-nav-key="harness"
         title="Browse every harness layer: GREP rules, RAG corpus, citation graph, tools, online providers">Layers <span aria-hidden="true">→</span></a>
    </div>
  </nav>

</div>
