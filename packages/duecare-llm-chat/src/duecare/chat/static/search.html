<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cross-layer search · DueCare</title>
  <link rel="stylesheet" href="/static/_chrome.css" />
  <style>
    * { box-sizing: border-box; }
    html, body { min-height: 100vh; }
    header { padding: 14px 24px; background: var(--paper); border-bottom: 1px solid var(--line-soft);
              display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
    header h1 { margin: 0; font-size: 16px; color: var(--ink); font-weight: 600; letter-spacing: -0.01em; }
    .sub { font-size: 13px; color: var(--ink-3); flex: 1; }
    .container { padding: 32px; max-width: 1100px; margin: 0 auto; }
    .search-box { width: 100%; padding: 14px 18px; font-size: 16px;
                   border: 1px solid var(--line); background: var(--paper);
                   color: var(--ink); border-radius: 8px;
                   font-family: var(--sans); }
    .search-box:focus { outline: 0; border-color: var(--accent);
                box-shadow: 0 0 0 4px oklch(0.85 0.05 195 / 0.3); }
    .total { font-size: 12px; color: var(--ink-3); margin-top: 8px; font-family: var(--mono); }
    .group { margin-top: 24px; background: var(--paper); border: 1px solid var(--line);
              border-radius: 12px; padding: 22px; }
    .group h2 { margin: 0 0 14px; font-size: 11px; text-transform: uppercase;
                 letter-spacing: 0.08em; display: flex; align-items: center; gap: 8px;
                 font-family: var(--mono); color: var(--ink-3); font-weight: 500; }
    .group h2 .count { color: var(--ink-4); font-size: 11px; font-weight: 400; }
    .group h2 a { margin-left: auto; font-size: 11px; font-weight: 400;
                   text-decoration: none; color: var(--accent-ink); }
    .hit { padding: 12px 0; border-bottom: 1px solid var(--line-soft); }
    .hit:last-child { border-bottom: 0; }
    .hit .label { font-family: var(--mono);
                   font-size: 13px; font-weight: 600; color: var(--ink); }
    .hit .source { font-size: 11.5px; color: var(--ink-3); margin-top: 3px; }
    .hit .summary { font-size: 13px; color: var(--ink-2); margin-top: 5px; line-height: 1.5; }
    .severity { display: inline-block; padding: 2px 7px; border-radius: 4px;
                 font-size: 10px; margin-left: 6px; font-weight: 500; text-transform: uppercase;
                 letter-spacing: 0.06em; font-family: var(--mono); }
    .severity.critical { background: var(--ember-soft); color: oklch(0.40 0.13 45); border: 1px solid oklch(0.85 0.06 45); }
    .severity.high     { background: oklch(0.96 0.03 80); color: oklch(0.40 0.10 80); border: 1px solid oklch(0.85 0.06 80); }
    .severity.medium   { background: var(--accent-soft); color: var(--accent-ink); border: 1px solid oklch(0.85 0.05 195); }
    .severity.low      { background: var(--paper-2); color: var(--ink-3); border: 1px solid var(--line); }
    .empty { padding: 30px; text-align: center; color: var(--ink-3); font-style: italic; }
    a.back { color: var(--ink-3); font-size: 12px; text-decoration: none; font-family: var(--mono); }
    a.back:hover { color: var(--accent-ink); }
    mark { background: oklch(0.94 0.08 80); color: var(--ink); padding: 0 3px; border-radius: 2px; }
    .examples { margin-top: 12px; display: flex; gap: 6px; flex-wrap: wrap; }
    .example { padding: 5px 12px; font-size: 12px; border: 1px solid var(--line);
                background: var(--paper); color: var(--ink-2); border-radius: 999px; cursor: pointer; }
    .example:hover { border-color: var(--ink-3); background: var(--paper-2); color: var(--ink); }
  </style>
  <script src="/static/_nav.js" defer></script>
</head>
<body data-nav="search">
  <header>
    
    <h1>Cross-layer search</h1>
    <div class="sub">Type any term — results from persona / GREP / RAG / tools all in one pane.</div>
  </header>
  <div class="container">
    <input id="q" class="search-box" type="text" placeholder="passport, debt bondage, POEA, Cap. 57, kafala…" autofocus />
    <div class="examples">
      <span class="example" onclick="setQ('passport')">passport</span>
      <span class="example" onclick="setQ('debt bondage')">debt bondage</span>
      <span class="example" onclick="setQ('POEA')">POEA</span>
      <span class="example" onclick="setQ('Cap. 57')">Cap. 57</span>
      <span class="example" onclick="setQ('kafala')">kafala</span>
      <span class="example" onclick="setQ('fee camouflage')">fee camouflage</span>
      <span class="example" onclick="setQ('Filipina')">Filipina</span>
      <span class="example" onclick="setQ('novation')">novation</span>
    </div>
    <div class="total" id="total"></div>
    <div id="results"></div>
  </div>
  <script>
    let lastQ = "";
    function escapeHtml(s) {
      return String(s == null ? "" : s).replace(/[&<>"']/g, c =>
        ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }
    function highlight(s, q) {
      if (!q) return escapeHtml(s);
      const esc = escapeHtml(s);
      const re = new RegExp(`(${q.replace(/[-/\\^$*+?.()|[\]{}]/g, '\\$&')})`, 'gi');
      return esc.replace(re, '<mark>$1</mark>');
    }
    function setQ(q) {
      document.getElementById("q").value = q;
      runSearch(q);
    }
    async function runSearch(q) {
      const total = document.getElementById("total");
      const results = document.getElementById("results");
      if (!q || !q.trim()) {
        total.textContent = "";
        results.innerHTML = "";
        return;
      }
      lastQ = q;
      try {
        const r = await fetch(`/api/search-all?q=${encodeURIComponent(q)}`, {cache: "no-store"});
        if (!r.ok) throw new Error("HTTP " + r.status);
        const d = await r.json();
        if (d.q !== lastQ) return;  // stale response
        total.textContent = `${d.total || 0} match${(d.total || 0) === 1 ? "" : "es"} across ${(d.groups || []).length} layer(s)`;
        if (!d.groups || !d.groups.length) {
          results.innerHTML = `<div class="empty">No matches for <strong>${escapeHtml(q)}</strong>.</div>`;
          return;
        }
        results.innerHTML = d.groups.map(g => `
          <div class="group">
            <h2>
              <span style="display:inline-block; width:10px; height:10px; border-radius:50%; background:${g.color || 'var(--muted)'};"></span>
              ${escapeHtml(g.label)}
              <span class="count">(${g.hits.length} of ${g.n_total})</span>
              <a href="${escapeHtml(g.viewer)}" target="_blank" style="color:${g.color || 'var(--accent)'};">Open viewer ↗</a>
            </h2>
            ${g.hits.map(h => `
              <div class="hit">
                <div class="label">
                  ${highlight(h.label || h.id || "", q)}
                  ${h.severity ? `<span class="severity ${escapeHtml(h.severity)}">${escapeHtml(h.severity)}</span>` : ""}
                </div>
                ${h.source ? `<div class="source">${highlight(h.source, q)}</div>` : ""}
                ${h.citation ? `<div class="source">${highlight(h.citation, q)}</div>` : ""}
                ${h.summary ? `<div class="summary">${highlight(h.summary, q)}</div>` : ""}
              </div>
            `).join("")}
          </div>
        `).join("");
      } catch (e) {
        results.innerHTML = `<div class="empty" style="color:oklch(0.40 0.13 45);">Error: ${escapeHtml(e.message)}</div>`;
      }
    }
    // Debounced live search
    let debounce = null;
    document.getElementById("q").addEventListener("input", e => {
      clearTimeout(debounce);
      debounce = setTimeout(() => runSearch(e.target.value), 200);
    });
  </script>
</body>
</html>
