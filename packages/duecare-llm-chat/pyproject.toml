[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "duecare-llm-chat"
version = "0.17.0"
description = "DueCare reviewer workbench for Gemma 4 demos: FastAPI app, static workbench pages, harness contracts, local model loading, replay artifacts, and Kaggle/Cloudflare launch support."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [{name = "Taylor Amarel"}]
dependencies = [
    "fastapi>=0.115.0",
    "python-multipart>=0.0.6",
    "uvicorn>=0.30.0",
    "pydantic>=2.9.0",
]

[project.urls]
Homepage = "https://github.com/TaylorAmarelTech/gemma4_comp"

[tool.hatch.build.targets.wheel]
packages = ["src/duecare"]
include = [
    "src/duecare/chat/static/**/*",
    "src/duecare/chat/classifier_static/**/*",
    # Explicit JSON include so a stale hatchling default can't
    # silently drop curator-block files from the wheel. Every JSON
    # file under harness/ ships — examples library + 5-tier rubrics +
    # required-element rubrics + universal rubric + the four
    # curator-block files (classifier signals, use-case affinity,
    # authoritative statutes, known statute sections). Adding a new
    # *.json under harness/ should auto-pick-up via the glob.
    "src/duecare/chat/harness/*.json",
]

[tool.hatch.build.targets.sdist]
# Source distribution mirrors the wheel — keep the JSONs available
# so a downstream `pip install --no-binary` reproduces the same data.
include = [
    "src/duecare/chat/static/**/*",
    "src/duecare/chat/classifier_static/**/*",
    "src/duecare/chat/harness/*.json",
]
